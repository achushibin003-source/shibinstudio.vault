<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — 3D Thapas & Audio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07090f;
      color: #f4f6fb;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #hero3d {
      width: 100%;
      height: 78vh;
      min-height: 420px;
      position: relative;
      touch-action: pan-y;
    }
    .hero-overlay {
      position: relative;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }
    h1 { font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -0.02em; }
    p.sub { color: #b8c2d9; margin-top: 8px; line-height: 1.5; }
    .sound-btn {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 215, 130, 0.35);
      background: rgba(14, 18, 28, 0.9);
      color: #fff2cc;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hero3d"></div>
  <div class="hero-overlay">
    <h1>Thapas &amp; Creative Studio</h1>
    <p class="sub">Drag horizontally on the 3D figure to rotate. Tap anywhere on the screen to start or unmute background audio.</p>
  </div>

  <button id="soundToggle" class="sound-btn" type="button" aria-label="Toggle Audio">
    <span id="soundStatus">Sound: Off (Tap Screen)</span>
  </button>

  <audio id="bgMusic" src="OM Special Duty.mp3" loop preload="auto"></audio>

  <script type="module">
    import * as THREE from 'three';

    // Audio loop + first-interaction unlock
    const audio = document.getElementById('bgMusic');
    const soundBtn = document.getElementById('soundToggle');
    const soundStatus = document.getElementById('soundStatus');
    let audioUnlocked = false;

    function updateSoundLabel() {
      if (audio.error) {
        soundStatus.textContent = 'MP3 Not Found (Check Root)';
        return;
      }
      soundStatus.textContent = audio.paused ? 'Sound: Paused (Tap)' : 'Sound: Looping On';
    }

    async function tryPlayAudio() {
      try {
        audio.muted = false;
        await audio.play();
        audioUnlocked = true;
      } catch (_) {
        // Autoplay blocked until direct user gesture
      }
      updateSoundLabel();
    }

    audio.addEventListener('error', updateSoundLabel);
    audio.addEventListener('play', updateSoundLabel);
    audio.addEventListener('pause', updateSoundLabel);

    soundBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (audio.paused) {
        await tryPlayAudio();
      } else {
        audio.pause();
        updateSoundLabel();
      }
    });

    window.addEventListener('pointerdown', () => {
      if (!audioUnlocked && audio.paused) {
        tryPlayAudio();
      }
    }, { passive: true });

    tryPlayAudio();

    // Zero-flicker solid 3D Padmasana meditating figure
    const container = document.getElementById('hero3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090f);

    const camera = new THREE.PerspectiveCamera(
      40,
      container.clientWidth / Math.max(container.clientHeight, 1),
      1,
      30
    );
    camera.position.set(0, 1.3, 6.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const ambLight = new THREE.AmbientLight(0xdbe6ff, 1.15);
    scene.add(ambLight);
    const keyLight = new THREE.DirectionalLight(0xffe4b5, 2.1);
    keyLight.position.set(3, 5, 4);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x7aa2ff, 0.9);
    rimLight.position.set(-3, 2, -3);
    scene.add(rimLight);

    const sageGroup = new THREE.Group();
    scene.add(sageGroup);

    const robeMat = new THREE.MeshStandardMaterial({ color: 0x1c2b59, roughness: 0.65, metalness: 0.05 });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0xd9a441, roughness: 0.35, metalness: 0.6 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xd89b72, roughness: 0.55, metalness: 0.02 });
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x15473c, roughness: 0.45, metalness: 0.15 });

    // Lotus pedestal
    const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.55, 0.24, 36), baseMat);
    pedestal.position.set(0, -1.05, 0);
    sageGroup.add(pedestal);

    // Crossed Padmasana legs
    const leftLeg = new THREE.Mesh(new THREE.CapsuleGeometry(0.21, 1.15, 12, 20), robeMat);
    leftLeg.rotation.z = Math.PI * 0.46;
    leftLeg.rotation.y = 0.22;
    leftLeg.position.set(-0.12, -0.78, 0.24);
    sageGroup.add(leftLeg);

    const rightLeg = new THREE.Mesh(new THREE.CapsuleGeometry(0.21, 1.15, 12, 20), robeMat);
    rightLeg.rotation.z = Math.PI * 0.54;
    rightLeg.rotation.y = -0.22;
    rightLeg.position.set(0.12, -0.68, 0.3);
    sageGroup.add(rightLeg);

    // Torso & gold sash
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.78, 16, 24), robeMat);
    torso.position.set(0, -0.05, 0);
    sageGroup.add(torso);

    const sash = new THREE.Mesh(new THREE.TorusGeometry(0.41, 0.045, 12, 32), trimMat);
    sash.rotation.x = Math.PI * 0.42;
    sash.position.set(0, -0.25, 0.02);
    sageGroup.add(sash);

    // Arms & hands in meditation
    const leftArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.58, 10, 16), robeMat);
    leftArm.position.set(-0.46, -0.22, 0.22);
    leftArm.rotation.x = 0.55;
    leftArm.rotation.z = -0.25;
    sageGroup.add(leftArm);

    const rightArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.58, 10, 16), robeMat);
    rightArm.position.set(0.46, -0.22, 0.22);
    rightArm.rotation.x = 0.55;
    rightArm.rotation.z = 0.25;
    sageGroup.add(rightArm);

    const handL = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 16), skinMat);
    handL.position.set(-0.16, -0.54, 0.46);
    sageGroup.add(handL);

    const handR = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 16), skinMat);
    handR.position.set(0.16, -0.54, 0.46);
    sageGroup.add(handR);

    // Head & topknot
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 24), skinMat);
    head.position.set(0, 0.78, 0.04);
    sageGroup.add(head);

    const topknot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), trimMat);
    topknot.position.set(0, 1.12, 0.02);
    sageGroup.add(topknot);

    // Horizontal 360 drag rotation
    let dragging = false;
    let prevX = 0;
    let targetRotY = 0;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      dragging = true;
      prevX = e.clientX;
    });
    window.addEventListener('pointerup', () => { dragging = false; });
    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - prevX;
      prevX = e.clientX;
      targetRotY += dx * 0.012;
    });

    window.addEventListener('resize', () => {
      if (!container.clientWidth || !container.clientHeight) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      sageGroup.rotation.y += (targetRotY - sageGroup.rotation.y) * 0.1;
      sageGroup.position.y = Math.sin(t * 1.4) * 0.05;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
